name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Django + Channels
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_DEBUG: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install bubblewrap
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install dependencies
        run: pip install -r backend/requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .

      - name: Django system checks
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Tests
        working-directory: backend
        run: |
          pytest \
            --cov=apps --cov=config \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    name: Frontend · Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Format check
        working-directory: frontend
        run: npm run format:check

      - name: Production build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E · Docker Compose
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Build Compose images
        run: docker compose build

      - name: Start Compose stack
        run: docker compose up -d --wait --wait-timeout 180

      - name: Verify API, sandbox, and pages
        run: |
          docker compose ps
          curl -fsS http://127.0.0.1:8000/api/health/
          docker compose exec -T api python manage.py check_terminal
          for path in / /learn/your-first-repository; do
            curl -fsSL "http://127.0.0.1:3000${path}" > /dev/null
          done

      - name: Install frontend test dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright against Compose
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          E2E_HEALTH_URL: http://127.0.0.1:8000/api/health/
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
          if-no-files-found: ignore

      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Compose
        if: always()
        run: docker compose down -v --remove-orphans
